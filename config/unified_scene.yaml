# 阶段 1 统一场景约定。运行时随机化只能覆盖此文件声明的对象和范围。
scene_xml: assets/panda_mjcf/unified_panda_objects_scene.xml
robot:
  base_frame: panda_link0
  end_effector_frame: panda_hand
  arm_joints: [joint1, joint2, joint3, joint4, joint5, joint6, joint7]
  gripper_joints: [finger_joint1, finger_joint2]
cameras:
  fixed: {name: camera_fixed, width: 640, height: 480}
  wrist: {name: camera_wrist, width: 640, height: 480}
  global: {name: camera_global, width: 960, height: 720}
objects:
  red_cylinder: {body: red_cylinder, geom: red_cylinder_geom}
  green_cylinder: {body: green_cylinder, geom: green_cylinder_geom}
  blue_cylinder: {body: blue_cylinder, geom: blue_cylinder_geom}
  yellow_mug: {body: yellow_mug, geom: yellow_mug_body_collision}
  mug_pedestal: {body: mug_pedestal, geom: mug_pedestal_geom}
  tray_pedestal: {body: tray_pedestal, geom: tray_pedestal_geom}
  purple_cube: {body: purple_cube, geom: purple_cube_geom}
  magenta_block: {body: magenta_block, geom: magenta_block_geom}
  tray: {body: tray, drop_site: tray_drop_zone}
